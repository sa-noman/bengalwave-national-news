<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><title>BengalWave password reset</title></head>
<body>
  <h2>BengalWave পাসওয়ার্ড রিসেট</h2>
  <p>নতুন পাসওয়ার্ড নির্ধারণ করতে নিচের লিংকটি খুলুন।</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">পাসওয়ার্ড রিসেট করুন</a></p>
  <p>আপনি এই অনুরোধ না করে থাকলে ইমেইলটি উপেক্ষা করুন। লিংকটি কারও সঙ্গে শেয়ার করবেন না।</p>
</body>
</html>
