name: Live Cloudflare Turnstile activation smoke once
on:
  push:
    branches: [test/turnstile-production-smoke-20261014]
    paths:
      - .github/workflows/turnstile-live-smoke-once.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install app and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify live invisible Turnstile and safe CSP in Chromium
        run: node scripts/turnstile-live-readonly-smoke.mjs
