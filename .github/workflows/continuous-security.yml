name: Continuous public security checks
on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Check dependency advisories including CI development tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

  public-boundaries:
    # A pull request must never execute its modified probe against production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Probe live public security boundaries without credentials
        run: node scripts/security-boundary-probe.mjs

  codeql:
    # Static analysis runs even if an audit or the live website fails.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          category: '/language:javascript-typescript'
