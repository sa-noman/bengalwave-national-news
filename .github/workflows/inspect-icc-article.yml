name: Inspect ICC article metadata
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-icc-article.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public article metadata
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 - <<'PY'
          import urllib.request, re, html, json
          from html.parser import HTMLParser
          u="https://www.prothomalo.com/world/usa/ps3pjrfgwt"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
          with urllib.request.urlopen(req,timeout=25) as f: s=f.read().decode("utf-8","replace")
          class P(HTMLParser):
            def __init__(self): super().__init__();self.m=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=="meta" and ("property" in d or "name" in d):
                self.m.append((d.get("property",d.get("name")),d.get("content","")))
          p=P();p.feed(s)
          for k,v in p.m:
            if k in ["og:title","og:description","og:image","article:published_time","description","twitter:title"]:
              print(k,":",v[:1500])
          for x in re.findall(r'<script[^>]*type="application/ld\\+json"[^>]*>(.*?)</script>',s,re.S|re.I):
            try:
              d=json.loads(html.unescape(x))
              if isinstance(d,dict):
                print("JSON-LD:",json.dumps({k:d.get(k) for k in ("headline","description","datePublished","articleBody","image") if k in d},ensure_ascii=False)[:7000])
            except:pass
          print("HTML LENGTH:",len(s))
          from bs4 import BeautifulSoup
          soup=BeautifulSoup(s,"html.parser")
          for selector in ["article p","[class*=story] p","[class*=article] p","main p"]:
            paras=[p.get_text(" ",strip=True) for p in soup.select(selector)]
            paras=[p for p in paras if len(p)>40]
            print("SELECTOR",selector,"COUNT",len(paras))
            if paras:
              for p in paras[:22]: print("ARTICLE PARAGRAPH:",p[:1300])
              break
          PY
