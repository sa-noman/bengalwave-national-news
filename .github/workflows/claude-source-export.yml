name: Export source for Claude (temporary)
on:
  push:
    branches:
      - feature/system-dark-mode-20261012
    paths:
      - .github/workflows/claude-source-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed development branch
        uses: actions/checkout@v4
      - name: Build private source-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git ls-files -z -- src public docs scripts tests README.md package.json package-lock.json next.config.ts tsconfig.json middleware.ts .env.example | xargs -0 zip -q -9 export/BengalWave-Claude-DarkMode-Source.zip
          test -s export/BengalWave-Claude-DarkMode-Source.zip
          unzip -t export/BengalWave-Claude-DarkMode-Source.zip | tail -1
      - name: Upload ZIP for private download
        uses: actions/upload-artifact@v4
        with:
          name: bengalwave-claude-source-20261013
          path: export/BengalWave-Claude-DarkMode-Source.zip
          retention-days: 3
