name: Website checks
on:
  push:
    branches: [main, "feature/**", "fix/**", "security/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Local HTTP smoke checks (preview mode)
        run: |
          VERCEL_ENV=preview npm run start -- -p 3100 > /tmp/bengalwave-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/http-smoke.mjs
      - name: Production-mode indexing HTTP smoke checks
        run: |
          rm -rf .next
          VERCEL_ENV=production npm run build
          VERCEL_ENV=production npm run start -- -p 3101 > /tmp/bengalwave-production-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          SMOKE_MODE=production SMOKE_BASE_URL=http://127.0.0.1:3101 node scripts/http-smoke.mjs

  visual_regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install browser tooling
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Build baseline main branch
        run: |
          git worktree add /tmp/bw-ui-baseline "${{ github.event.pull_request.base.sha }}"
          cd /tmp/bw-ui-baseline
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          VERCEL_ENV=preview npm run build
      - name: Build PR version
        run: VERCEL_ENV=preview npm run build
      - name: Compare desktop and mobile layouts
        run: |
          (cd /tmp/bw-ui-baseline && VERCEL_ENV=preview npm run start -- -p 3200) > /tmp/bw-base.log 2>&1 &
          BASE_PID=$!
          VERCEL_ENV=preview npm run start -- -p 3201 > /tmp/bw-candidate.log 2>&1 &
          CANDIDATE_PID=$!
          trap 'kill $BASE_PID $CANDIDATE_PID || true' EXIT
          sleep 8
          node scripts/visual-compare.mjs
          BROWSER_SMOKE_URL=http://127.0.0.1:3201 node scripts/browser-security-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-before-after-screenshots
          path: visual-artifacts/*.png
          retention-days: 7
