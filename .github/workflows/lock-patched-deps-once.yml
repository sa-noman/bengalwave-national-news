name: Lock patched dependencies (temporary)
on:
  push:
    branches: [security/audit-hardening-20261014]
    paths: [.github/workflows/lock-patched-deps-once.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Lock patched packages without running installation scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check high and critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Save audited lockfile to security PR branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: lock audited Sharp and PostCSS patches'
          git push origin HEAD:security/audit-hardening-20261014
