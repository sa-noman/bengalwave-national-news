name: Newsroom preview compilation
on:
  push:
    branches: [preview/professional-newsroom-20261021]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lockfile:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Refresh preview-only dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the refreshed lockfile only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview): lock pinned Tiptap dependencies"
            git push origin HEAD:preview/professional-newsroom-20261021
          fi
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Typecheck, test and build from the committed lockfile
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
