name: Remove watermark banner from published article photo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-news-photo.yml"

permissions:
  contents: write

jobs:
  clean-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove publisher logo strip
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path("public/news/charmonai-council-2026.webp")
          im=Image.open(p).convert("RGB")
          w,h=im.size
          start=int(h*.65)
          y0=None
          for y in range(start,h):
              near_white=sum(1 for x in range(0,w,3) if all(v>=224 for v in im.getpixel((x,y))))
              if near_white/max(1,len(range(0,w,3))) >= .62:
                  y0=y
                  break
          if y0 is None:
              raise RuntimeError(f"Could not identify publisher banner in {w}x{h} image")
          if y0 < int(h*.72):
              raise RuntimeError(f"Unexpected banner boundary {y0}/{h}; refusing unsafe crop")
          im.crop((0,0,w,y0)).save(p,format="WEBP",quality=88,method=6)
          print(f"Removed publisher logo strip: {w}x{h} -> {w}x{y0}")
          PY
      - name: Save cleaned photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/charmonai-council-2026.webp
          git commit -m "fix(news): remove publisher logo from article image"
          git push
