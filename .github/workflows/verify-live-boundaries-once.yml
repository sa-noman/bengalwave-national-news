name: Verify production security boundaries after rollout
on:
  push:
    branches: [test/live-boundary-security-20261014]
    paths:
      - .github/workflows/verify-live-boundaries-once.yml
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read-only live public and unauthenticated security boundary probes
        run: node scripts/security-boundary-probe.mjs
