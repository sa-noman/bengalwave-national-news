name: Production nonce CSP real-browser audit
on:
  push:
    branches: [test/prod-nonce-20261014]
    paths: [.github/workflows/prod-nonce-browser-once.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare browser runtime
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare actual live request nonce and execute scripts in Chromium
        env:
          BROWSER_SMOKE_URL: https://bengalwave.news
        run: node scripts/browser-security-check.mjs
      - name: Check public HTTP security boundaries
        run: node scripts/security-boundary-probe.mjs
