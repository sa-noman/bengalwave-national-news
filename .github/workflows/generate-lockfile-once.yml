name: Generate dependency lockfile (one-off)
on:
  push:
    branches: [security/audit-hardening-20261014]
    paths:
      - .github/workflows/generate-lockfile-once.yml
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/security/audit-hardening-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve reproducible npm dependencies without package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only on isolated audit branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: lock resolved production and build dependencies'
          git push origin HEAD:security/audit-hardening-20261014
