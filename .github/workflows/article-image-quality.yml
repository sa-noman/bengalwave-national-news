name: Prepare high-quality article images (preview only)
on:
  push:
    branches:
      - fix/partial-news-images-20261010
    paths:
      - scripts/generate-article-images.mjs
      - .github/workflows/article-image-quality.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create high-quality images
        run: node scripts/generate-article-images.mjs
      - name: Save full images to GitHub preview branch
        run: |
          git add public/news/*-article.webp
          if git diff --cached --quiet; then
            echo "No images changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: save full-resolution article photographs"
          git push origin HEAD:fix/partial-news-images-20261010
