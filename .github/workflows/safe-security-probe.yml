name: Manual production security boundary probes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Public read-only security boundary probes
        run: node scripts/security-boundary-probe.mjs
