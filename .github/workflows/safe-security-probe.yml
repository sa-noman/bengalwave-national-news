name: Manual production security boundary probes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Public read-only security boundary probes
        run: node scripts/security-boundary-probe.mjs
